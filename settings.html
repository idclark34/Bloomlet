<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline';" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Settings</title>
    <style>
      :root {
        --bg: #f8fafc;
        --card: #ffffff;
        --fg: #0f172a;
        --muted: #64748b;
        --border: #e2e8f0;
        --primary: #111827;
        --radius: 12px;
      }
      body { font-family: -apple-system, system-ui, Segoe UI, Roboto, sans-serif; margin: 0; background: var(--bg); color: var(--fg); }
      .container { padding: 16px; }
      .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        box-shadow: 0 8px 24px rgba(15, 23, 42, 0.06);
        padding: 16px;
      }
      h1 { font-size: 18px; margin: 0 0 12px; }
      .subtle { color: var(--muted); font-size: 12px; margin: -6px 0 12px; }
      .section { padding: 12px 0; border-top: 1px solid var(--border); }
      .section:first-of-type { border-top: 0; padding-top: 0; }
      .field { margin-bottom: 12px; }
      label { display: block; font-weight: 600; margin-bottom: 6px; }
      select {
        font-size: 14px;
        width: 100%;
        padding: 8px 10px;
        border-radius: 10px;
        border: 1px solid var(--border);
        background: #fff;
        color: var(--fg);
        outline: none;
      }
      select:focus { border-color: #94a3b8; box-shadow: 0 0 0 4px rgba(148,163,184,0.2); }
      .row { display: flex; align-items: center; gap: 10px; }
      .hint { color: var(--muted); font-size: 12px; }
      .actions { margin-top: 12px; display: flex; gap: 8px; }
      button { padding: 10px 12px; border-radius: 10px; border: 1px solid var(--border); background: #fff; cursor: pointer; font-weight: 600; }
      button.primary { background: var(--primary); color: #fff; border-color: var(--primary); }
      button:hover { filter: brightness(0.98); }
      button.primary:hover { filter: brightness(1.08); }
      /* Toggle switch */
      .toggle { display: flex; align-items: center; gap: 10px; cursor: pointer; user-select: none; }
      .toggle input { position: absolute; opacity: 0; pointer-events: none; }
      .switch {
        position: relative;
        width: 40px;
        height: 24px;
        background: #e5e7eb;
        border-radius: 999px;
        transition: background 0.2s ease;
        border: 1px solid var(--border);
      }
      .switch::after {
        content: '';
        position: absolute;
        top: 2px;
        left: 2px;
        width: 20px;
        height: 20px;
        background: #fff;
        border-radius: 50%;
        box-shadow: 0 1px 2px rgba(0,0,0,0.12);
        transition: transform 0.2s ease;
      }
      .toggle input:checked + .switch {
        background: #111827;
        border-color: #111827;
      }
      .toggle input:checked + .switch::after {
        transform: translateX(16px);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="card">
        <h1>Settings</h1>
        <div class="subtle">Tune when, how, and what you see.</div>

        <div class="section">
          <div class="field">
            <label for="userName">Your name (optional)</label>
            <input id="userName" type="text" placeholder="e.g. Alex" maxlength="50"
              style="font-size:14px;width:100%;padding:8px 10px;border-radius:10px;border:1px solid var(--border);outline:none;color:var(--fg);background:#fff;box-sizing:border-box" />
            <div class="hint" style="margin-top:4px">Personalizes some messages just for you.</div>
          </div>
        </div>

        <div class="section">
          <div class="field">
            <label for="interval">Interval</label>
            <select id="interval">
              <option value="30m">Every 30 minutes</option>
              <option value="60m">Every 1 hour</option>
              <option value="120m">Every 2 hours</option>
              <option value="random">Random between 1–2 hours</option>
            </select>
          </div>
          <div class="field">
            <div class="row" style="justify-content:space-between;margin-bottom:6px">
              <label for="popupDuration" style="margin:0">Duration</label>
              <span id="popupDurationLabel" class="hint"></span>
            </div>
            <input id="popupDuration" type="range" min="0" max="10" step="1"
              style="width:100%;accent-color:#111827" />
          </div>
          <div class="field">
            <div class="row" style="justify-content:space-between;margin-bottom:6px">
              <label for="popupOpacity" style="margin:0">Opacity</label>
              <span id="popupOpacityLabel" class="hint"></span>
            </div>
            <input id="popupOpacity" type="range" min="20" max="100" step="5"
              style="width:100%;accent-color:#111827" />
          </div>
          <div class="field">
            <label class="toggle">
              <input id="quietHoursEnabled" type="checkbox" />
              <span class="switch"></span>
              <span>Quiet hours</span>
            </label>
          </div>
          <div id="quietHoursRange" style="display:none">
            <div class="row" style="gap:12px;margin-bottom:12px">
              <div style="flex:1">
                <label for="quietHoursStart" style="font-size:12px;color:var(--muted);margin-bottom:4px;display:block">From</label>
                <input id="quietHoursStart" type="time"
                  style="width:100%;font-size:14px;padding:8px 10px;border-radius:10px;border:1px solid var(--border);outline:none;color:var(--fg);background:#fff;box-sizing:border-box" />
              </div>
              <div style="flex:1">
                <label for="quietHoursEnd" style="font-size:12px;color:var(--muted);margin-bottom:4px;display:block">Until</label>
                <input id="quietHoursEnd" type="time"
                  style="width:100%;font-size:14px;padding:8px 10px;border-radius:10px;border:1px solid var(--border);outline:none;color:var(--fg);background:#fff;box-sizing:border-box" />
              </div>
            </div>
          </div>
          <div class="field">
            <label for="position">Position</label>
            <select id="position">
              <option value="corner">Corner</option>
              <option value="center">Center</option>
            </select>
          </div>
        </div>

        <div class="section">
          <div class="field">
            <label for="popupSize">Size</label>
            <select id="popupSize">
              <option value="small">Small (260 × 100)</option>
              <option value="medium">Medium (320 × 120)</option>
              <option value="large">Large (420 × 160)</option>
            </select>
          </div>
          <div class="field">
            <label for="theme">Theme</label>
            <select id="theme">
              <option value="light">Light</option>
              <option value="dark">Dark</option>
              <option value="pastel">Pastel</option>
            </select>
          </div>
          <div class="field">
            <label for="fontFamily">Font</label>
            <select id="fontFamily">
              <option value="system">System (San Francisco)</option>
              <option value="serif">Serif (Georgia)</option>
              <option value="mono">Monospace (Courier)</option>
              <option value="rounded">Rounded (Comic Sans)</option>
              <option value="cursive">Cursive (Snell Roundhand)</option>
            </select>
          </div>
          <div class="field">
            <div class="row" style="justify-content:space-between;margin-bottom:6px">
              <label for="borderRadius" style="margin:0">Corner radius</label>
              <span id="borderRadiusLabel" class="hint"></span>
            </div>
            <input id="borderRadius" type="range" min="0" max="28" step="2"
              style="width:100%;accent-color:#111827" />
          </div>
        </div>

        <div class="section">
          <div class="field">
            <label>Categories</label>
            <label class="toggle">
              <input id="comforting" type="checkbox" />
              <span class="switch"></span>
              <span>Comforting</span>
            </label>
            <label class="toggle">
              <input id="motivational" type="checkbox" />
              <span class="switch"></span>
              <span>Motivational</span>
            </label>
            <label class="toggle">
              <input id="mindfulness" type="checkbox" />
              <span class="switch"></span>
              <span>Mindfulness</span>
            </label>
            <label class="toggle">
              <input id="quotes" type="checkbox" />
              <span class="switch"></span>
              <span>Quotes</span>
            </label>
          </div>
        </div>

        <div class="section">
          <div class="field">
            <label>My affirmations</label>
            <div class="hint" style="margin-bottom:8px">Add your own messages to the mix.</div>
            <div style="display:flex;gap:6px;margin-bottom:8px">
              <input id="custom-input" type="text" placeholder="Write something kind…" maxlength="200"
                style="flex:1;font-size:14px;padding:8px 10px;border-radius:10px;border:1px solid var(--border);outline:none;color:var(--fg);background:#fff" />
              <button id="custom-add">Add</button>
            </div>
            <ul id="custom-list" style="list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px"></ul>
          </div>
        </div>

        <div class="actions">
          <button id="save" class="primary">Save</button>
        </div>
      </div>
    </div>
    <script src="./settings.js"></script>
  </body>
  </html>
