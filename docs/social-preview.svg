<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#1a1f2e"/>
    </linearGradient>
    <radialGradient id="glow" cx="42%" cy="45%" r="45%">
      <stop offset="0%" stop-color="#f9a8d4" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e2535"/>
      <stop offset="100%" stop-color="#161b27"/>
    </linearGradient>
    <linearGradient id="pill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="petalgrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f9a8d4"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="12" stdDeviation="28" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
    <filter id="cardglow">
      <feDropShadow dx="0" dy="0" stdDeviation="20" flood-color="#f472b6" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Subtle dot grid -->
  <pattern id="dots" x="0" y="0" width="36" height="36" patternUnits="userSpaceOnUse">
    <circle cx="18" cy="18" r="1" fill="#ffffff" opacity="0.035"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#dots)"/>

  <!-- ===== SVG Flower icon ===== -->
  <g transform="translate(120, 148)">
    <!-- 8 petals using ellipses rotated around center -->
    <g transform="translate(36,36)">
      <ellipse cx="0" cy="-18" rx="9" ry="16" fill="url(#petalgrad)" opacity="0.95" transform="rotate(0)"/>
      <ellipse cx="0" cy="-18" rx="9" ry="16" fill="url(#petalgrad)" opacity="0.90" transform="rotate(45)"/>
      <ellipse cx="0" cy="-18" rx="9" ry="16" fill="url(#petalgrad)" opacity="0.95" transform="rotate(90)"/>
      <ellipse cx="0" cy="-18" rx="9" ry="16" fill="url(#petalgrad)" opacity="0.90" transform="rotate(135)"/>
      <ellipse cx="0" cy="-18" rx="9" ry="16" fill="url(#petalgrad)" opacity="0.95" transform="rotate(180)"/>
      <ellipse cx="0" cy="-18" rx="9" ry="16" fill="url(#petalgrad)" opacity="0.90" transform="rotate(225)"/>
      <ellipse cx="0" cy="-18" rx="9" ry="16" fill="url(#petalgrad)" opacity="0.95" transform="rotate(270)"/>
      <ellipse cx="0" cy="-18" rx="9" ry="16" fill="url(#petalgrad)" opacity="0.90" transform="rotate(315)"/>
      <!-- Center -->
      <circle cx="0" cy="0" r="11" fill="#fde68a"/>
      <circle cx="0" cy="0" r="7" fill="#fbbf24"/>
    </g>
  </g>

  <!-- Bloomlet wordmark -->
  <text x="120" y="272" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="60" font-weight="700" fill="#f1f5f9" letter-spacing="-1.5">Bloomlet</text>

  <!-- Beta pill -->
  <rect x="122" y="288" width="60" height="26" rx="13" fill="url(#pill)"/>
  <text x="152" y="305" font-family="-apple-system, BlinkMacSystemFont, Arial, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">BETA</text>

  <!-- Tagline -->
  <text x="120" y="368" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="23" fill="#94a3b8" font-weight="400">Little moments of encouragement,</text>
  <text x="120" y="400" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="23" fill="#94a3b8" font-weight="400">right when you need them.</text>

  <!-- Divider -->
  <rect x="120" y="432" width="430" height="1" fill="#2d3748" opacity="0.8"/>

  <!-- Feature pills -->
  <rect x="120" y="452" width="118" height="30" rx="15" fill="#1a2030" stroke="#2d3748" stroke-width="1"/>
  <text x="179" y="471" font-family="-apple-system, BlinkMacSystemFont, Arial, sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">macOS app</text>

  <rect x="250" y="452" width="116" height="30" rx="15" fill="#1a2030" stroke="#2d3748" stroke-width="1"/>
  <text x="308" y="471" font-family="-apple-system, BlinkMacSystemFont, Arial, sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">No tracking</text>

  <rect x="378" y="452" width="82" height="30" rx="15" fill="#1a2030" stroke="#2d3748" stroke-width="1"/>
  <text x="419" y="471" font-family="-apple-system, BlinkMacSystemFont, Arial, sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">Free</text>

  <!-- Site URL -->
  <text x="120" y="560" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#475569" letter-spacing="0.2">idclark34.github.io/Bloomlet</text>

  <!-- ===== App popup mockup (right side) ===== -->
  <g filter="url(#shadow)">
    <!-- Main popup card -->
    <rect x="690" y="160" width="368" height="104" rx="16" fill="url(#card)" stroke="#2d3748" stroke-width="1"/>
    <!-- Titlebar traffic lights -->
    <circle cx="718" cy="182" r="5.5" fill="#f87171" opacity="0.85"/>
    <circle cx="736" cy="182" r="5.5" fill="#fbbf24" opacity="0.85"/>
    <circle cx="754" cy="182" r="5.5" fill="#34d399" opacity="0.85"/>
    <!-- Divider under titlebar -->
    <rect x="690" y="194" width="368" height="1" fill="#2d3748" opacity="0.6"/>
    <!-- Message text -->
    <text x="874" y="230" font-family="Georgia, 'Times New Roman', serif" font-size="16.5" fill="#e2e8f0" text-anchor="middle" opacity="0.95">You're doing better than you think.</text>
    <!-- Footer timestamp -->
    <text x="874" y="253" font-family="-apple-system, BlinkMacSystemFont, Arial, sans-serif" font-size="10.5" fill="#4a5568" text-anchor="middle">Bloomlet  •  2:41 PM</text>
  </g>

  <!-- Second card (behind/below) -->
  <g opacity="0.38" filter="url(#shadow)">
    <rect x="710" y="286" width="368" height="80" rx="16" fill="#161b27" stroke="#2a3040" stroke-width="1"/>
    <text x="894" y="332" font-family="Georgia, 'Times New Roman', serif" font-size="15" fill="#94a3b8" text-anchor="middle">One step at a time.</text>
  </g>

  <!-- Third card (furthest back) -->
  <g opacity="0.18">
    <rect x="730" y="382" width="368" height="72" rx="16" fill="#161b27" stroke="#252b3b" stroke-width="1"/>
    <text x="914" y="422" font-family="Georgia, 'Times New Roman', serif" font-size="14" fill="#64748b" text-anchor="middle">Take a breath. You've got this.</text>
  </g>
</svg>
