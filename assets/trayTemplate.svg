<svg width="22" height="22" viewBox="0 0 22 22" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Monochrome cherry blossom — black on transparent for macOS template image -->
  <g transform="translate(11,11)">
    <!-- 5 petals at 72° intervals, tip at 10px from center -->
    <path d="M0,0 C-2.8,-1.8 -3.2,-5.2 0,-10 C3.2,-5.2 2.8,-1.8 0,0"
          fill="black" transform="rotate(0)"/>
    <path d="M0,0 C-2.8,-1.8 -3.2,-5.2 0,-10 C3.2,-5.2 2.8,-1.8 0,0"
          fill="black" transform="rotate(72)"/>
    <path d="M0,0 C-2.8,-1.8 -3.2,-5.2 0,-10 C3.2,-5.2 2.8,-1.8 0,0"
          fill="black" transform="rotate(144)"/>
    <path d="M0,0 C-2.8,-1.8 -3.2,-5.2 0,-10 C3.2,-5.2 2.8,-1.8 0,0"
          fill="black" transform="rotate(216)"/>
    <path d="M0,0 C-2.8,-1.8 -3.2,-5.2 0,-10 C3.2,-5.2 2.8,-1.8 0,0"
          fill="black" transform="rotate(288)"/>
    <!-- Center -->
    <circle r="3" fill="black"/>
  </g>
</svg>
